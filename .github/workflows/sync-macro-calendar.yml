name: Sync macro calendar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-macro-calendar.yml"
      - "supabase/functions/sync-macro-calendar/**"
  schedule:
    # 08:30 ET releases are 12:30 UTC in EDT and 13:30 UTC in EST.
    - cron: "25-59/5 12,13 * * 1-5"
    # 10:00 ET releases are 14:00 UTC in EDT and 15:00 UTC in EST.
    - cron: "0-30/5 14,15 * * 1-5"
    - cron: "0,30 16-22 * * 1-5"
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh red and orange US macro events
        env:
          MACRO_SYNC_SECRET: ${{ secrets.MACRO_SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-sync-secret: ${MACRO_SYNC_SECRET}" \
            --data '{}' \
            https://zzynqlqnzdhkffvqvpzt.supabase.co/functions/v1/sync-macro-calendar
