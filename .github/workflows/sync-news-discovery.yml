name: Sync free news discovery

on:
  schedule:
    # Broad market discovery runs every 30 minutes, including weekends.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-news-discovery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Refresh the GDELT discovery radar
        env:
          RESEARCH_SYNC_SECRET: ${{ secrets.RESEARCH_SYNC_SECRET }}
        run: |
          slot=$((GITHUB_RUN_NUMBER % 4))
          response=$(curl --fail-with-body --silent --show-error --max-time 90 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-sync-secret: ${RESEARCH_SYNC_SECRET}" \
            --header "x-discovery-slot: ${slot}" \
            --data '{}' \
            https://zzynqlqnzdhkffvqvpzt.supabase.co/functions/v1/sync-news-discovery)
          echo "${response}"
          if [ "$(echo "${response}" | jq -r '.ok')" != "true" ]; then
            echo "::warning::GDELT provider was unavailable; the latest clean evidence packet remains active."
          fi
