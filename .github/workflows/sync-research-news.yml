name: Sync research news

on:
  schedule:
    # 17:17, 19:17, 21:17, 23:17, 01:17 and 03:17 Asia/Bangkok.
    # All six UTC executions belong to the same US weekday session.
    # Avoid minute 00, when GitHub says scheduled runs are most likely to be delayed or dropped.
    - cron: "17 10,12,14,16,18,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-research-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect the due Reuters or Shay window
        env:
          RESEARCH_SYNC_SECRET: ${{ secrets.RESEARCH_SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-sync-secret: ${RESEARCH_SYNC_SECRET}" \
            --data '{}' \
            https://zzynqlqnzdhkffvqvpzt.supabase.co/functions/v1/sync-research-news
